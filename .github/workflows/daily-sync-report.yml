name: Daily Sync & Apache Iceberg Activity Report

on:
  schedule:
    # Run at 00:05 UTC every day (just after midnight)
    - cron: '5 0 * * *'
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Date to analyze (YYYY-MM-DD). Defaults to yesterday.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sync-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 1: Sync fork with apache/iceberg main ──────────────────────────
      - name: Sync fork with apache/iceberg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Syncing fork with upstream apache/iceberg ==="
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/merge-upstream" \
            -d '{"branch":"main"}')
          echo "$RESPONSE" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          msg = data.get('message', data.get('merge_type', 'unknown'))
          print(f'Sync result: {msg}')
          "

      # ── Step 2: Determine report date ────────────────────────────────────────
      - name: Set report date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.report_date }}" ]; then
            REPORT_DATE="${{ github.event.inputs.report_date }}"
          else
            REPORT_DATE=$(date -u -d "yesterday" '+%Y-%m-%d')
          fi
          echo "REPORT_DATE=$REPORT_DATE" >> $GITHUB_ENV
          echo "report_date=$REPORT_DATE" >> $GITHUB_OUTPUT
          echo "Analyzing date: $REPORT_DATE"

      # ── Step 3: Fetch data from apache/iceberg GitHub API ───────────────────
      - name: Fetch Apache Iceberg activity data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_DATE: ${{ env.REPORT_DATE }}
        run: |
          mkdir -p /tmp/iceberg-data

          echo "=== Fetching merged PRs for $REPORT_DATE ==="
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/search/issues?q=repo:apache/iceberg+is:pr+is:merged+merged:${REPORT_DATE}&per_page=100&sort=updated&order=desc" \
            > /tmp/iceberg-data/merged_prs.json
          MERGED_COUNT=$(python3 -c "import json; d=json.load(open('/tmp/iceberg-data/merged_prs.json')); print(d.get('total_count',0))")
          echo "Merged PRs: $MERGED_COUNT"

          echo "=== Fetching new issues for $REPORT_DATE ==="
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/search/issues?q=repo:apache/iceberg+is:issue+created:${REPORT_DATE}&per_page=100&sort=created&order=desc" \
            > /tmp/iceberg-data/new_issues.json
          ISSUES_COUNT=$(python3 -c "import json; d=json.load(open('/tmp/iceberg-data/new_issues.json')); print(d.get('total_count',0))")
          echo "New issues: $ISSUES_COUNT"

          echo "=== Fetching new PRs for $REPORT_DATE ==="
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/search/issues?q=repo:apache/iceberg+is:pr+created:${REPORT_DATE}&per_page=100&sort=created&order=desc" \
            > /tmp/iceberg-data/new_prs.json
          NEW_PRS_COUNT=$(python3 -c "import json; d=json.load(open('/tmp/iceberg-data/new_prs.json')); print(d.get('total_count',0))")
          echo "New PRs: $NEW_PRS_COUNT"

      # ── Step 4: Fetch PR details (diffs, files changed) ─────────────────────
      - name: Fetch detailed PR information
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/iceberg-data/pr_details

          python3 << 'PYEOF'
          import json, urllib.request, os, time

          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'
          }

          def fetch(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          with open('/tmp/iceberg-data/merged_prs.json') as f:
              data = json.load(f)

          for pr in data.get('items', []):
              pr_num = pr['number']
              print(f"Fetching details for PR #{pr_num}: {pr['title'][:60]}")
              try:
                  # Get PR details
                  detail = fetch(f"https://api.github.com/repos/apache/iceberg/pulls/{pr_num}")
                  # Get changed files
                  files = fetch(f"https://api.github.com/repos/apache/iceberg/pulls/{pr_num}/files?per_page=100")
                  combined = {
                      'pr': pr,
                      'detail': detail,
                      'files': files[:50]  # limit to 50 files
                  }
                  with open(f'/tmp/iceberg-data/pr_details/{pr_num}.json', 'w') as f:
                      json.dump(combined, f, indent=2)
                  time.sleep(0.3)  # rate limit courtesy
              except Exception as e:
                  print(f"  Error: {e}")
          PYEOF

      # ── Step 5: Generate Markdown report ────────────────────────────────────
      - name: Generate daily report
        env:
          REPORT_DATE: ${{ env.REPORT_DATE }}
        run: |
          python3 << 'PYEOF'
          import json, os, glob
          from datetime import datetime, timedelta

          report_date = os.environ['REPORT_DATE']
          gen_date    = datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')

          # Load data
          with open('/tmp/iceberg-data/merged_prs.json')  as f: merged_data = json.load(f)
          with open('/tmp/iceberg-data/new_issues.json')  as f: issues_data = json.load(f)
          with open('/tmp/iceberg-data/new_prs.json')     as f: new_prs_data = json.load(f)

          merged_prs = merged_data.get('items', [])
          new_issues = issues_data.get('items', [])
          new_prs    = new_prs_data.get('items', [])

          # Load PR details
          pr_details = {}
          for fpath in glob.glob('/tmp/iceberg-data/pr_details/*.json'):
              with open(fpath) as f:
                  d = json.load(f)
                  pr_details[d['pr']['number']] = d

          def label_names(item):
              return ', '.join(f"`{l['name']}`" for l in item.get('labels', [])) or '—'

          def merged_time(item):
              mt = item.get('pull_request', {}).get('merged_at', '')
              return mt[:16].replace('T', ' ') if mt else '—'

          def fmt_files(files_list):
              if not files_list:
                  return ''
              lines = []
              for f in files_list[:20]:
                  fname = f.get('filename', '')
                  adds  = f.get('additions', 0)
                  dels  = f.get('deletions', 0)
                  lines.append(f"  - `{fname}` (+{adds}/-{dels})")
              if len(files_list) > 20:
                  lines.append(f"  - … 及其他 {len(files_list)-20} 个文件")
              return '\n'.join(lines)

          # ── Build report ──────────────────────────────────────────────────────
          lines = []
          lines.append(f"# Apache Iceberg 每日动态报告\n")
          lines.append(f"> **分析日期**: {report_date}")
          lines.append(f"> **数据来源**: [apache/iceberg](https://github.com/apache/iceberg)")
          lines.append(f"> **生成时间**: {gen_date}\n")
          lines.append("---\n")

          # Summary table
          lines.append("## 今日概览\n")
          lines.append("| 指标 | 数量 |")
          lines.append("|------|------|")
          lines.append(f"| 合并 PR | **{len(merged_prs)}** |")
          lines.append(f"| 新增 Issue | **{len(new_issues)}** |")
          lines.append(f"| 新增 PR | **{len(new_prs)}** |")
          lines.append("")

          # ── Merged PRs ───────────────────────────────────────────────────────
          lines.append(f"---\n\n## 已合并 PR（{len(merged_prs)} 个）\n")

          for pr in merged_prs:
              num   = pr['number']
              title = pr['title']
              author= pr['user']['login']
              url   = pr['html_url']
              mt    = merged_time(pr)
              lbls  = label_names(pr)
              body  = (pr.get('body') or '').strip()[:2000]

              lines.append(f"### PR #{num} — {title}\n")
              lines.append(f"| 字段 | 内容 |")
              lines.append(f"|------|------|")
              lines.append(f"| **PR 链接** | [#{num}]({url}) |")
              lines.append(f"| **作者** | {author} |")
              lines.append(f"| **合并时间** | {mt} UTC |")
              lines.append(f"| **标签** | {lbls} |")

              # files changed
              detail = pr_details.get(num, {})
              files_list = detail.get('files', [])
              if files_list:
                  fnames = [f.get('filename','') for f in files_list[:10]]
                  lines.append(f"| **修改文件（前10）** | {', '.join(f'`{x}`' for x in fnames[:5])} |")

              lines.append("")
              if body:
                  lines.append(f"**描述**：\n\n{body}\n")

              if files_list:
                  lines.append(f"**变更文件（共 {len(files_list)} 个）**：\n")
                  lines.append(fmt_files(files_list))
                  lines.append("")

              lines.append("---\n")

          # ── New Issues ───────────────────────────────────────────────────────
          lines.append(f"\n## 新增 Issue（{len(new_issues)} 个）\n")
          lines.append("| # | 标题 | 类型 | 作者 | 状态 |")
          lines.append("|---|------|------|------|------|")
          for issue in new_issues:
              num    = issue['number']
              title  = issue['title']
              author = issue['user']['login']
              state  = issue['state']
              url    = issue['html_url']
              itype  = issue['labels'][0]['name'] if issue.get('labels') else '—'
              lines.append(f"| [#{num}]({url}) | {title} | {itype} | {author} | {state} |")
          lines.append("")

          for issue in new_issues:
              num   = issue['number']
              title = issue['title']
              url   = issue['html_url']
              body  = (issue.get('body') or '').strip()[:3000]
              lines.append(f"### Issue #{num} — {title}\n")
              lines.append(f"**作者**: {issue['user']['login']}  |  **状态**: {issue['state']}  |  **链接**: [#{num}]({url})\n")
              if body:
                  lines.append(f"{body}\n")
              lines.append("---\n")

          # ── New PRs ──────────────────────────────────────────────────────────
          lines.append(f"\n## 新增 PR（{len(new_prs)} 个）\n")
          lines.append("| # | 标题 | 标签 | 作者 | 状态 |")
          lines.append("|---|------|------|------|------|")
          for pr in new_prs:
              num    = pr['number']
              title  = pr['title']
              author = pr['user']['login']
              state  = pr['state']
              url    = pr['html_url']
              lbls   = label_names(pr)
              lines.append(f"| [#{num}]({url}) | {title} | {lbls} | {author} | {state} |")
          lines.append("")

          # Write report
          os.makedirs('daily-reports', exist_ok=True)
          report_path = f"daily-reports/{report_date}-iceberg-daily-report.md"
          with open(report_path, 'w', encoding='utf-8') as f:
              f.write('\n'.join(lines))

          print(f"Report written to {report_path}")
          print(f"  Merged PRs:  {len(merged_prs)}")
          print(f"  New Issues:  {len(new_issues)}")
          print(f"  New PRs:     {len(new_prs)}")
          PYEOF

      # ── Step 6: Commit and push report ──────────────────────────────────────
      - name: Commit and push report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          REPORT_FILE="daily-reports/${REPORT_DATE}-iceberg-daily-report.md"
          git add "$REPORT_FILE"

          if git diff --cached --quiet; then
            echo "No changes to commit (report already up to date)"
          else
            git commit -m "chore: add daily Iceberg activity report for ${REPORT_DATE}

          Auto-generated report covering:
          - Merged PRs from apache/iceberg
          - New issues created
          - New PRs opened

          Generated by daily-sync-report workflow."

            git push origin HEAD:main
            echo "Report committed and pushed successfully"
          fi
